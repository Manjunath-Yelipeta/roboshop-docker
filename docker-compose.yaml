services:
    mongodb:                                                                                                                                                                                                    
        build: ./mongo    
        image: mathslogic/mongo:4.0.0                                                                                                                                                                                     
        container_name: mongo 
        volumes:
          - mongodb:/data/db
                                                                                                                                                                                                                  
    catalogue:                                                                                                                                                                                                  
      build: ./catalogue
      image: mathslogic/catalogue:4.0.0                                                                                                                                                                                      
      container_name: catalogue                                                                                                                                                                                                                                                                                                                                          
      depends_on:                                                                                                                                                                                               
        - mongodb                                                                                                                                                                                                                                                                                                                                                                                        
    user:                                                                                                                                                                                                      
      build: ./user                                                                                                                                                                                         
      image: mathslogic/user:4.0.0                                                                                                                                                                                     
      container_name: user  
      environment:      
        MONGO: "true"                                                                                                                                                                       
        MONGO_URL: "mongodb://mongo:27017/user"
        REDIS_URL: "redis://redis:6379"
      depends_on:                                                                                                                                                                                               
        - mongodb  
        - redis
    redis:
      build: ./redis
      image: mathslogic/redis:4.0.0
      container_name: redis
      volumes:
        - redis:/data

    mysql:
      build: ./mysql
      image: mathslogic/mysql:4.0.0
      container_name: mysql
      environment:
        MYSQL_ROOT_PASSWORD: RoboShop@1
      volumes:
        - mysql:/var/lib/mysql
  

    cart:
      build: ./cart
      image: mathslogic/cart:4.0.0
      container_name: cart
      environment:
        CATALOGUE_HOST: catalogue
        REDIS_HOST: redis
        CATALOGUE_PORT: 8080
      depends_on:
        - catalogue
        - redis

    shipping:                                                                                                                                                                                                               
      build: ./shipping
      image: mathslogic/shipping:4.0.0
      container_name: shipping
      environment:
        CART_ENDPOINT: cart:8080
        DB_HOST: mysql
      depends_on:
        - mysql
        - cart

    rabbitmq:
      build: ./rabbitmq
      image: mathslogic/rabbitmq:4.0.0
      container_name: rabbitmq
      environment:
        RABBITMQ_DEFAULT_USER: guest
        RABBITMQ_DEFAULT_PASS: guest
      volumes:
        - rabbitmq:/var/lib/rabbitmq

    payment:
      build: ./payment
      image: mathslogic/payment:4.0.0
      container_name: payment
      environment:
        CART_HOST: cart
        CART_PORT: 8080
        USER_HOST: user
        USER_PORT: 8080
        AMQP_HOST: rabbitmq
        AMQP_USER: guest
        AMQP_PASS: guest
      depends_on:
        - rabbitmq
        - user
        - cart

    frontend:                                                                                                                                                                                                   
      build: ./frontend                                                                                                                                                                                         
      image: mathslogic/frontend:4.0.0                                                                                                                                                                                     
      container_name: frontend                                                                                                                                                                         
      depends_on:                                                                                                                                                                                               
        - catalogue 
        - user
        - cart
        - shipping
        - payment
      ports:
        - "80:80"

networks:
  default:
    name: roboshop
    driver: bridge
    external: false  # Tells Docker Compose: "Create this network for me; I didn't make it yet.   

volumes:
  mongodb: #docker volume create mongodb
  mysql: #docker volume create mysql
  redis: #docker volume create redis
  rabbitmq: #docker volume create rabbitmq