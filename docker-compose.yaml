services:
    mongodb:                                                                                                                                                                                                    
        build: ./mongo    
        image: mongo:v1                                                                                                                                                                                       
        container_name: mongo                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                  
    catalogue:                                                                                                                                                                                                  
      build: "./catalogue"                                                                                                                                                                                     
      container_name: catalogue                                                                                                                                                                                                                                                                                                                                          
      depends_on:                                                                                                                                                                                               
        - mongodb                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                
    frontend:                                                                                                                                                                                                   
      build: ./frontend                                                                                                                                                                                         
      container_name: frontend-compose                                                                                                                                                                          
      depends_on:                                                                                                                                                                                               
        - catalogue  
      ports:
        - "80:80"

networks:
  default:
    name: roboshop
    driver: bridge
    external: false  # Tells Docker Compose: "Create this network for me; I didn't make it yet.                                                                                                                                                                                           