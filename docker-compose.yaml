services:
    mongodb:                                                                                                                                                                                                    
        build: ./mongo    
        image: mongo:v1                                                                                                                                                                                       
        container_name: mongo                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                  
    catalogue:                                                                                                                                                                                                  
      build: ./catalogue
      image: catalogue:v1                                                                                                                                                                                       
      container_name: catalogue                                                                                                                                                                                                                                                                                                                                          
      depends_on:                                                                                                                                                                                               
        - mongodb                                                                                                                                                                                                                                                                                                                                                                                        
    user:                                                                                                                                                                                                      
      build: ./user                                                                                                                                                                                         
      image: user:v1                                                                                                                                                                                       
      container_name: user  
      environment:      
        MONGO: "true"                                                                                                                                                                       
        MONGO_URL: "mongodb://mongo:27017/user"
        REDIS_URL: "redis://redis:6379"
      depends_on:                                                                                                                                                                                               
        - mongodb  
        - redis
    redis:
      build: ./redis
      image: redis:v1
      container_name: redis

    mysql:
      build: ./mysql
      image: mysql:v1
      container_name: mysql
      environment:
        MYSQL_ROOT_PASSWORD: RoboShop@1
  

    cart:
      build: ./cart
      image: cart:v1
      container_name: cart
      environment:
        CATALOGUE_HOST: catalogue
        REDIS_HOST: redis
        CATALOGUE_PORT: 8080
      depends_on:
        - catalogue
        - redis

    shipping:                                                                                                                                                                                                               
      build: ./shipping
      image: shipping:v1
      container_name: shipping
      environment:
        CART_ENDPOINT: cart:8080
        DB_HOST: mysql
      depends_on:
        - mysql
        - cart

    rabbitmq:
      build: ./rabbitmq
      image: rabbitmq:v1
      container_name: rabbitmq
      environment:
        RABBITMQ_DEFAULT_USER: guest
        RABBITMQ_DEFAULT_PASS: guest

    payment:
      build: ./payment
      image: payment:v1
      container_name: payment
      environment:
        CART_HOST: cart
        CART_PORT: 8080
        USER_HOST: user
        USER_PORT: 8080
        AMQP_HOST: rabbitmq
        AMQP_USER: guest
        AMQP_PASS: guest
      depends_on:
        - rabbitmq
        - user
        - cart

    frontend:                                                                                                                                                                                                   
      build: ./frontend                                                                                                                                                                                         
      image: frontend:v1                                                                                                                                                                                       
      container_name: frontend                                                                                                                                                                         
      depends_on:                                                                                                                                                                                               
        - catalogue 
        - user
        - cart
        - shipping
        - payment
      ports:
        - "80:80"

networks:
  default:
    name: roboshop
    driver: bridge
    external: false  # Tells Docker Compose: "Create this network for me; I didn't make it yet.                                                                                                                                                                                           